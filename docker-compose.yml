services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: gurmesa_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
